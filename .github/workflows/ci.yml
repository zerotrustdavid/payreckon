name: CI

# pull_request, deliberately, and never pull_request_target. On a public
# repository pull_request_target runs with the base repository's secrets and a
# writable token while checking out an outside contributor's code, which is the
# standard route for a malicious pull request to exfiltrate them. This workflow
# needs no secrets at all, and asks for read-only contents so that a compromised
# step has nothing useful to reach for.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts, deliberately. Dependency install scripts run arbitrary
      # Node on every install, and nothing else in this pipeline inspects them.
      # Verified that a full --ignore-scripts install still passes lint, tests,
      # palette and build: the only two install scripts in the tree are dev-only
      # and no-ops here, and the native binding they prepare is installed by npm
      # through optionalDependencies without needing the script to run.
      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Theme contrast and colour vision checks
        run: npm run palette

      - name: Production build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Catches a dependency acquiring a postinstall, which npm audit does not
      # report and which would otherwise land silently in a patch release.
      - name: Check for unexpected install scripts
        run: npm run check:install-scripts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The binary is fetched and checksummed rather than pulled in as a third
      # party action, so this step depends on nothing that can change under it
      # between runs.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      # Scans the tree as it would be merged, which is what stops a new secret
      # landing. Full history is not scanned here: it contains one known
      # finding, a Web3Forms access key that is publishable by design and whose
      # continued exposure is a deliberately accepted risk rather than one that
      # has been remediated. Failing every build on it forever would only teach
      # people to ignore this job. Scan history manually with
      # `gitleaks git . --log-opts="--all" -c .gitleaks.toml` after any change
      # to the rules.
      - name: Scan for secrets
        run: ./gitleaks dir . -c .gitleaks.toml --redact --no-banner
